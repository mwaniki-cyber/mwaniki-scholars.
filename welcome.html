
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mwaniki Scholars | Welcome</title>

<style>

/* =========================================================
   MWANIKI SCHOLARS — CINEMATIC INTRO
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    background:
        radial-gradient(
            circle at 50% 45%,
            #123f66 0%,
            #082c4b 35%,
            #031a2d 70%,
            #010d18 100%
        );

    color: white;
}


/* =========================================================
   INTRO CONTAINER
   ========================================================= */

.intro {
    position: fixed;
    inset: 0;
    z-index: 99999;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(15, 86, 125, 0.35),
            transparent 45%
        );
}


/* =========================================================
   BACKGROUND GRID
   ========================================================= */

.grid {
    position: absolute;
    inset: -50%;

    background-image:
        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size: 55px 55px;

    transform:
        perspective(500px)
        rotateX(60deg)
        translateY(100px);

    animation:
        gridMove 12s linear infinite;

    opacity: .45;
}

@keyframes gridMove {

    from {
        transform:
            perspective(500px)
            rotateX(60deg)
            translateY(0);
    }

    to {
        transform:
            perspective(500px)
            rotateX(60deg)
            translateY(55px);
    }

}


/* =========================================================
   FLOATING MEDICAL PARTICLES
   ========================================================= */

.particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.particle {
    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #72e5ff;

    box-shadow:
        0 0 12px #72e5ff,
        0 0 25px rgba(114,229,255,.6);

    animation:
        floatParticle linear infinite;
}

.particle:nth-child(1) {
    left: 10%;
    top: 80%;
    animation-duration: 8s;
}

.particle:nth-child(2) {
    left: 20%;
    top: 70%;
    animation-duration: 11s;
}

.particle:nth-child(3) {
    left: 32%;
    top: 90%;
    animation-duration: 9s;
}

.particle:nth-child(4) {
    left: 45%;
    top: 75%;
    animation-duration: 13s;
}

.particle:nth-child(5) {
    left: 58%;
    top: 90%;
    animation-duration: 10s;
}

.particle:nth-child(6) {
    left: 70%;
    top: 75%;
    animation-duration: 12s;
}

.particle:nth-child(7) {
    left: 82%;
    top: 88%;
    animation-duration: 9s;
}

.particle:nth-child(8) {
    left: 92%;
    top: 70%;
    animation-duration: 14s;
}

@keyframes floatParticle {

    0% {
        transform:
            translateY(0)
            scale(.5);

        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    85% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(-100vh)
            scale(1.3);

        opacity: 0;
    }

}


/* =========================================================
   MAIN CONTENT
   ========================================================= */

.content {
    position: relative;
    z-index: 5;

    width: min(900px, 90%);

    text-align: center;

    display: flex;
    flex-direction: column;
    align-items: center;

    animation:
        contentEntrance 1.8s ease forwards;
}

@keyframes contentEntrance {

    from {
        opacity: 0;
        transform:
            translateY(35px)
            scale(.96);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================================================
   MEDICAL CORE
   ========================================================= */

.medical-core {

    position: relative;

    width: 145px;
    height: 145px;

    margin-bottom: 35px;

    display: flex;
    align-items: center;
    justify-content: center;

    animation:
        coreAppear 1.5s ease forwards;
}

@keyframes coreAppear {

    from {
        opacity: 0;
        transform: scale(.2) rotate(-180deg);
    }

    to {
        opacity: 1;
        transform: scale(1) rotate(0);
    }

}


/* =========================================================
   CORE CIRCLES
   ========================================================= */

.core-ring {

    position: absolute;

    border-radius: 50%;

    border: 1px solid rgba(113,224,255,.45);

}

.ring-one {

    width: 145px;
    height: 145px;

    animation:
        rotateRing 12s linear infinite;
}

.ring-two {

    width: 115px;
    height: 115px;

    border-style: dashed;

    animation:
        rotateRingReverse 9s linear infinite;
}

.ring-three {

    width: 85px;
    height: 85px;

    border-color:
        rgba(255,255,255,.25);

    animation:
        pulseRing 2s ease-in-out infinite;
}


@keyframes rotateRing {

    to {
        transform: rotate(360deg);
    }

}

@keyframes rotateRingReverse {

    to {
        transform: rotate(-360deg);
    }

}

@keyframes pulseRing {

    0%,100% {
        transform: scale(.92);
        opacity: .6;
    }

    50% {
        transform: scale(1.08);
        opacity: 1;
    }

}


/* =========================================================
   CROSS
   ========================================================= */

.medical-cross {

    position: relative;

    width: 52px;
    height: 52px;

    filter:
        drop-shadow(
            0 0 15px rgba(79,224,255,.8)
        );
}

.medical-cross::before,
.medical-cross::after {

    content: "";

    position: absolute;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #65dcff
        );

    border-radius: 5px;

}

.medical-cross::before {

    width: 52px;
    height: 16px;

    left: 0;
    top: 18px;

}

.medical-cross::after {

    width: 16px;
    height: 52px;

    left: 18px;
    top: 0;

}


/* =========================================================
   BRAND
   ========================================================= */

.brand {

    font-size:
        clamp(
            42px,
            7vw,
            78px
        );

    font-weight: 800;

    letter-spacing:
        clamp(
            2px,
            1vw,
            7px
        );

    line-height: 1;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #79e7ff,
            #ffffff
        );

    background-size: 200% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        shine 4s linear infinite;

    text-shadow:
        0 0 40px rgba(82,221,255,.18);
}

@keyframes shine {

    to {
        background-position:
            200% center;
    }

}


/* =========================================================
   TAGLINE
   ========================================================= */

.tagline {

    margin-top: 20px;

    font-size:
        clamp(
            16px,
            2vw,
            23px
        );

    color:
        rgba(255,255,255,.78);

    letter-spacing:
        2px;

    font-weight: 300;

    opacity: 0;

    animation:
        taglineAppear 1s ease
        1.3s forwards;
}

@keyframes taglineAppear {

    to {
        opacity: 1;
        transform:
            translateY(0);
    }

    from {
        opacity: 0;
        transform:
            translateY(15px);
    }

}


/* =========================================================
   WELCOME TEXT
   ========================================================= */

.welcome {

    margin-top: 35px;

    font-size:
        clamp(
            20px,
            3vw,
            31px
        );

    font-weight: 600;

    opacity: 0;

    animation:
        welcomeAppear 1s ease
        2s forwards;
}

@keyframes welcomeAppear {

    to {
        opacity: 1;
        transform:
            translateY(0);
    }

    from {
        opacity: 0;
        transform:
            translateY(15px);
    }

}


/* =========================================================
   HEARTBEAT
   ========================================================= */

.heartbeat {

    width:
        min(
            500px,
            80vw
        );

    height: 90px;

    margin-top: 25px;

    overflow: hidden;

    opacity: 0;

    animation:
        heartbeatAppear 1s ease
        2.4s forwards;
}

@keyframes heartbeatAppear {

    to {
        opacity: 1;
    }

}


.heartbeat svg {

    width: 100%;
    height: 100%;
}

.heartbeat-path {

    fill: none;

    stroke: #65e4ff;

    stroke-width: 3;

    stroke-linecap: round;

    stroke-dasharray: 800;

    stroke-dashoffset: 800;

    filter:
        drop-shadow(
            0 0 8px #65e4ff
        );

    animation:
        heartbeatDraw 2.4s
        ease-in-out
        2.5s forwards;
}

@keyframes heartbeatDraw {

    to {
        stroke-dashoffset: 0;
    }

}


/* =========================================================
   LOADING
   ========================================================= */

.loading-wrapper {

    width:
        min(
            380px,
            75vw
        );

    margin-top: 25px;

    opacity: 0;

    animation:
        loadingAppear 1s ease
        2.7s forwards;
}

@keyframes loadingAppear {

    to {
        opacity: 1;
    }

}


.loading-text {

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,.55);

    margin-bottom: 10px;
}


.loading-bar {

    width: 100%;
    height: 4px;

    background:
        rgba(255,255,255,.12);

    border-radius: 20px;

    overflow: hidden;
}


.loading-progress {

    width: 0%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            #36c7ff,
            #ffffff,
            #36c7ff
        );

    box-shadow:
        0 0 15px #36c7ff;

    animation:
        progress 4.5s
        ease-in-out
        2.8s forwards;
}

@keyframes progress {

    0% {
        width: 0%;
    }

    100% {
        width: 100%;
    }

}


/* =========================================================
   SKIP BUTTON
   ========================================================= */

.skip {

    position: absolute;

    right: 28px;
    bottom: 25px;

    z-index: 20;

    padding:
        10px 18px;

    border:
        1px solid
        rgba(255,255,255,.25);

    background:
        rgba(255,255,255,.06);

    color:
        rgba(255,255,255,.7);

    border-radius: 30px;

    cursor: pointer;

    font-size: 13px;

    backdrop-filter:
        blur(10px);

    transition:
        .3s ease;
}

.skip:hover {

    background:
        rgba(255,255,255,.15);

    color: white;

    transform:
        translateY(-2px);
}


/* =========================================================
   DECORATIVE MEDICAL SYMBOLS
   ========================================================= */

.symbol {

    position: absolute;

    color:
        rgba(111,222,255,.12);

    font-size: 50px;

    animation:
        symbolFloat
        6s ease-in-out infinite;
}

.symbol.one {
    left: 7%;
    top: 20%;
}

.symbol.two {
    right: 8%;
    top: 25%;
    animation-delay: 1s;
}

.symbol.three {
    left: 12%;
    bottom: 15%;
    animation-delay: 2s;
}

.symbol.four {
    right: 13%;
    bottom: 18%;
    animation-delay: 3s;
}

@keyframes symbolFloat {

    0%,100% {
        transform:
            translateY(0)
            rotate(0);
    }

    50% {
        transform:
            translateY(-20px)
            rotate(8deg);
    }

}


/* =========================================================
   EXIT ANIMATION
   ========================================================= */

.intro.exit {

    animation:
        introExit
        1s
        ease
        forwards;
}

@keyframes introExit {

    to {
        opacity: 0;
        transform:
            scale(1.08);
        pointer-events: none;
    }

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    .medical-core {
        width: 110px;
        height: 110px;
    }

    .ring-one {
        width: 110px;
        height: 110px;
    }

    .ring-two {
        width: 88px;
        height: 88px;
    }

    .ring-three {
        width: 65px;
        height: 65px;
    }

    .medical-cross {
        transform: scale(.75);
    }

    .symbol {
        font-size: 30px;
    }

    .skip {
        right: 15px;
        bottom: 15px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     INTRO
     ===================================================== -->

<div
    class="intro"
    id="intro"
>


    <!-- Background grid -->

    <div class="grid"></div>


    <!-- Floating particles -->

    <div class="particles">

        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

    </div>


    <!-- Floating medical symbols -->

    <div class="symbol one">
        ⚕
    </div>

    <div class="symbol two">
        🧬
    </div>

    <div class="symbol three">
        🫀
    </div>

    <div class="symbol four">
        🔬
    </div>


    <!-- =================================================
         MAIN CONTENT
         ================================================= -->

    <main class="content">


        <!-- Medical animated core -->

        <div class="medical-core">

            <div
                class="core-ring ring-one"
            ></div>

            <div
                class="core-ring ring-two"
            ></div>

            <div
                class="core-ring ring-three"
            ></div>

            <div
                class="medical-cross"
            ></div>

        </div>


        <!-- Brand -->

        <h1 class="brand">
            MWANIKI SCHOLARS
        </h1>


        <!-- Tagline -->

        <p class="tagline">
            Learn. Understand. Master Medicine.
        </p>


        <!-- Welcome -->

        <p class="welcome">
            Welcome to your medical learning journey.
        </p>


        <!-- =================================================
             HEARTBEAT
             ================================================= -->

        <div class="heartbeat">

            <svg
                viewBox="0 0 600 100"
                preserveAspectRatio="none"
            >

                <path
                    class="heartbeat-path"
                    d="
                    M0 50
                    L90 50
                    L110 50
                    L125 20
                    L140 80
                    L155 50
                    L190 50
                    L205 50
                    L220 50
                    L240 50
                    L255 10
                    L270 90
                    L285 50
                    L330 50
                    L350 50
                    L365 35
                    L380 65
                    L395 50
                    L430 50
                    L600 50
                    "
                />

            </svg>

        </div>


        <!-- =================================================
             LOADING
             ================================================= -->

        <div class="loading-wrapper">

            <div class="loading-text">
                Preparing your learning environment
            </div>

            <div class="loading-bar">

                <div
                    class="loading-progress"
                ></div>

            </div>

        </div>


    </main>


    <!-- Skip -->

    <button
        class="skip"
        id="skipIntro"
        type="button"
    >

        Skip intro →

    </button>


</div>


<script>

/* =========================================================
   MWANIKI SCHOLARS INTRO CONTROLLER
   ========================================================= */


/*
    CHANGE THIS IF YOUR DASHBOARD HAS
    A DIFFERENT FILE NAME.
*/

const DASHBOARD_URL =
    "dashboard.html";


const intro =
    document.getElementById(
        "intro"
    );


const skipButton =
    document.getElementById(
        "skipIntro"
    );


/* =========================================================
   GO TO DASHBOARD
   ========================================================= */

function goToDashboard() {

    if (!intro) {

        window.location.href =
            DASHBOARD_URL;

        return;

    }


    intro.classList.add(
        "exit"
    );


    setTimeout(
        () => {

            window.location.href =
                DASHBOARD_URL;

        },
        850
    );

}


/* =========================================================
   AUTOMATIC INTRO
   ========================================================= */

setTimeout(
    goToDashboard,
    6500
);


/* =========================================================
   SKIP
   ========================================================= */

skipButton.addEventListener(
    "click",
    () => {

        goToDashboard();

    }
);


/* =========================================================
   KEYBOARD SKIP
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" ||
            event.key === "Enter"
        ) {

            goToDashboard();

        }

    }
);


/* =========================================================
   PREVENT BACKGROUND SCROLL
   ========================================================= */

document.body.style.overflow =
    "hidden";

</script>

</body>
</html>
