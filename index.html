<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================================
         BASIC DOCUMENT SETTINGS
    ========================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <!-- =========================================
         MWANIKI SCHOLARS SEO
    ========================================== -->

    <title>
        Mwaniki Scholars | Medical Learning Platform
    </title>

    <meta
        name="description"
        content="Mwaniki Scholars is a medical learning platform for medical students, featuring medical courses, study notes, quizzes, self-testing and learning resources."
    >

    <meta
        name="keywords"
        content="Mwaniki Scholars, medical learning, medical education, medical students, medical courses, anatomy, physiology, pharmacology, microbiology, pathology, medical quizzes"
    >

    <meta
        name="author"
        content="Mwaniki Scholars"
    >

    <meta
        name="robots"
        content="index, follow"
    >


    <!-- =========================================
         CANONICAL URL
    ========================================== -->

    <link
        rel="canonical"
        href="https://mwaniki-cyber.github.io/mwaniki-scholars./"
    >


    <!-- =========================================
         OPEN GRAPH / SOCIAL SHARING
    ========================================== -->

    <meta
        property="og:title"
        content="Mwaniki Scholars | Medical Learning Platform"
    >

    <meta
        property="og:description"
        content="Medical courses, study notes, quizzes and self-testing resources for medical students."
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:url"
        content="https://mwaniki-cyber.github.io/mwaniki-scholars./"
    >

    <meta
        property="og:site_name"
        content="Mwaniki Scholars"
    >


    <!-- =========================================
         TWITTER / SOCIAL PREVIEW
    ========================================== -->

    <meta
        name="twitter:card"
        content="summary"
    >

    <meta
        name="twitter:title"
        content="Mwaniki Scholars | Medical Learning Platform"
    >

    <meta
        name="twitter:description"
        content="Medical courses, notes, quizzes and self-testing resources for medical students."
    >


    <!-- =========================================
         STRUCTURED DATA
         Helps search engines understand the site
    ========================================== -->

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Mwaniki Scholars",
        "url": "https://mwaniki-cyber.github.io/mwaniki-scholars./",
        "description": "Mwaniki Scholars is a medical learning platform providing medical courses, study notes, quizzes and self-testing resources for medical students."
    }
    </script>


    <!-- =========================================
         PAGE STYLES
    ========================================== -->

    <style>

        /* =====================================
           GLOBAL
        ===================================== */

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }


        body {
            background: #eef7fb;
            color: #ffffff;
        }


        /* =====================================
           HEADER
        ===================================== */

        header {

            background:
                linear-gradient(
                    135deg,
                    #063970,
                    #0b7285
                );

            color: white;

            padding: 20px;

            text-align: center;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.15);
        }


        .logo {

            font-size: 28px;

            font-weight: 700;

            letter-spacing: 0.5px;
        }


        .tagline {

            margin-top: 6px;

            font-size: 14px;

            opacity: 0.9;

            letter-spacing: 0.3px;
        }


        /* =====================================
           AUTH CONTAINER
        ===================================== */

        .auth-container {

            height: 520px;

            max-width: 1100px;

            margin: 30px auto;

            position: relative;

            overflow: hidden;

            border-radius: 25px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.15);
        }


        /* =====================================
           MEDICAL BACKGROUND
        ===================================== */

        .medical-bg {

            position: absolute;

            width: 100%;

            height: 100%;

            background:

                linear-gradient(
                    135deg,
                    #032b3a,
                    #0b7285,
                    #38bdf8
                );
        }


        /* =====================================
           FLOATING MEDICAL CROSSES
        ===================================== */

        .cross {

            position: absolute;

            font-size: 50px;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.20
                );

            animation:
                float 10s infinite;
        }


        .c1 {
            left: 10%;
        }


        .c2 {
            left: 35%;
            animation-delay: 2s;
        }


        .c3 {
            left: 65%;
            animation-delay: 4s;
        }


        .c4 {
            left: 85%;
            animation-delay: 6s;
        }


        @keyframes float {

            0% {
                transform:
                    translateY(500px);
            }

            100% {
                transform:
                    translateY(-100px);
            }

        }


        /* =====================================
           AUTHENTICATION BOX
        ===================================== */

        .auth-box {

            position: absolute;

            top: 50%;

            left: 50%;

            transform:
                translate(-50%, -50%);

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.15
                );

            backdrop-filter:
                blur(15px);

            -webkit-backdrop-filter:
                blur(15px);

            padding: 35px;

            width: 350px;

            border-radius: 20px;

            text-align: center;

            color: white;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.20);
        }


        /* =====================================
           WELCOME
        ===================================== */

        .auth-box h2 {

            margin-top: 0;

            margin-bottom: 8px;

            font-size: 27px;
        }


        .auth-box p {

            margin-top: 0;

            margin-bottom: 20px;

            font-size: 15px;

            opacity: 0.9;
        }


        /* =====================================
           INPUTS
        ===================================== */

        input {

            width: 90%;

            padding: 14px;

            margin: 10px;

            border: none;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            background: white;

            color: #222;
        }


        input:focus {

            box-shadow:
                0 0 0 3px
                rgba(
                    56,
                    189,
                    248,
                    0.35
                );
        }


        /* =====================================
           BUTTONS
        ===================================== */

        button {

            width: 90%;

            padding: 13px;

            margin: 7px;

            border: none;

            border-radius: 12px;

            background: #0b7285;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition:
                0.25s ease;
        }


        button:hover {

            background: #064747;

            transform:
                translateY(-1px);
        }


        button:active {

            transform:
                translateY(0);
        }


        /* =====================================
           FOOTER
        ===================================== */

        .footer {

            text-align: center;

            color: #4b6570;

            font-size: 13px;

            margin:
                10px 20px 25px;
        }


        /* =====================================
           MOBILE RESPONSIVENESS
        ===================================== */

        @media (max-width: 600px) {

            header {

                padding: 16px;
            }


            .logo {

                font-size: 22px;
            }


            .tagline {

                font-size: 12px;
            }


            .auth-container {

                margin: 20px 12px;

                height: 550px;

                border-radius: 20px;
            }


            .auth-box {

                width: 90%;

                max-width: 350px;

                padding: 25px;
            }


            .auth-box h2 {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         MWANIKI SCHOLARS HEADER
    ========================================== -->

    <header>

        <div class="logo">

            🏥 MWANIKI SCHOLARS

        </div>


        <div class="tagline">

            Medical Learning & Knowledge Portal

        </div>

    </header>



    <!-- =========================================
         LOGIN AREA
    ========================================== -->

    <div class="auth-container">


        <div class="medical-bg">


            <div class="cross c1">
                ✚
            </div>


            <div class="cross c2">
                ✚
            </div>


            <div class="cross c3">
                ✚
            </div>


            <div class="cross c4">
                ✚
            </div>


        </div>



        <!-- =====================================
             LOGIN BOX
        ====================================== -->

        <div class="auth-box">


            <h2>

                Welcome

            </h2>


            <p>

                Learn • Practice • Test • Advance

            </p>



            <!-- EMAIL -->

            <input
                type="email"
                id="email"
                placeholder="Email"
                autocomplete="email"
            >



            <!-- PASSWORD -->

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
            >



            <!-- CREATE ACCOUNT -->

            <button
                type="button"
                onclick="signUp()"
            >

                📝 Create Account

            </button>



            <!-- STUDENT LOGIN -->

            <button
                type="button"
                onclick="login()"
            >

                🎓 Student Login

            </button>



            <!-- TUTOR LOGIN -->

            <button
                type="button"
                onclick="tutorLogin()"
            >

                👨‍🏫 Tutor Login

            </button>



            <!-- ADMIN LOGIN -->

            <button
                type="button"
                onclick="adminLogin()"
            >

                ⚙️ Admin Login

            </button>


        </div>

    </div>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <div class="footer">

        © 2026 Mwaniki Scholars —
        Medical Learning & Knowledge Portal

    </div>



    <!-- =========================================
         EXISTING AUTHENTICATION SCRIPT
    ========================================== -->

    <script
        type="module"
        src="script.js"
    ></script>


</body>

</html>
