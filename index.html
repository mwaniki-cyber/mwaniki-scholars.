<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mwaniki Scholars</title>


<style>

/* =========================================================
   MWANIKI SCHOLARS — WELCOME / PORTAL SELECTOR
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

body {

    background:
        radial-gradient(
            circle at 50% 45%,
            #123f66 0%,
            #082c4b 35%,
            #031a2d 70%,
            #010d18 100%
        );

    color: white;

}


/* =========================================================
   INTRO
   ========================================================= */

.intro {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

}


/* =========================================================
   BACKGROUND
   ========================================================= */

.grid {

    position: absolute;

    inset: -50%;

    background-image:

        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size: 55px 55px;

    transform:
        perspective(500px)
        rotateX(60deg);

    animation:
        gridMove 12s linear infinite;

    opacity: .45;

}


@keyframes gridMove {

    from {

        transform:
            perspective(500px)
            rotateX(60deg)
            translateY(0);

    }

    to {

        transform:
            perspective(500px)
            rotateX(60deg)
            translateY(55px);

    }

}


/* =========================================================
   PARTICLES
   ========================================================= */

.particles {

    position: absolute;

    inset: 0;

    pointer-events: none;

}


.particle {

    position: absolute;

    width: 5px;

    height: 5px;

    border-radius: 50%;

    background: #72e5ff;

    box-shadow:
        0 0 12px #72e5ff,
        0 0 25px rgba(114,229,255,.6);

    animation:
        floatParticle linear infinite;

}


.particle:nth-child(1) {
    left: 10%;
    top: 80%;
    animation-duration: 8s;
}

.particle:nth-child(2) {
    left: 20%;
    top: 70%;
    animation-duration: 11s;
}

.particle:nth-child(3) {
    left: 32%;
    top: 90%;
    animation-duration: 9s;
}

.particle:nth-child(4) {
    left: 45%;
    top: 75%;
    animation-duration: 13s;
}

.particle:nth-child(5) {
    left: 58%;
    top: 90%;
    animation-duration: 10s;
}

.particle:nth-child(6) {
    left: 70%;
    top: 75%;
    animation-duration: 12s;
}

.particle:nth-child(7) {
    left: 82%;
    top: 88%;
    animation-duration: 9s;
}

.particle:nth-child(8) {
    left: 92%;
    top: 70%;
    animation-duration: 14s;
}


@keyframes floatParticle {

    0% {

        transform:
            translateY(0)
            scale(.5);

        opacity: 0;

    }

    15% {
        opacity: 1;
    }

    85% {
        opacity: 1;
    }

    100% {

        transform:
            translateY(-100vh)
            scale(1.3);

        opacity: 0;

    }

}


/* =========================================================
   MEDICAL SYMBOLS
   ========================================================= */

.symbol {

    position: absolute;

    color:
        rgba(111,222,255,.13);

    font-size: 55px;

    animation:
        symbolFloat 6s ease-in-out infinite;

}


.symbol.one {

    left: 7%;
    top: 20%;

}


.symbol.two {

    right: 8%;
    top: 25%;

    animation-delay: 1s;

}


.symbol.three {

    left: 12%;
    bottom: 15%;

    animation-delay: 2s;

}


.symbol.four {

    right: 13%;
    bottom: 18%;

    animation-delay: 3s;

}


@keyframes symbolFloat {

    0%,
    100% {

        transform:
            translateY(0)
            rotate(0);

    }

    50% {

        transform:
            translateY(-20px)
            rotate(8deg);

    }

}


/* =========================================================
   MAIN CONTENT
   ========================================================= */

.content {

    position: relative;

    z-index: 5;

    width:
        min(900px, 92%);

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

}


/* =========================================================
   MEDICAL CORE
   ========================================================= */

.medical-core {

    position: relative;

    width: 140px;

    height: 140px;

    margin-bottom: 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    animation:
        coreAppear 1.5s ease forwards;

}


@keyframes coreAppear {

    from {

        opacity: 0;

        transform:
            scale(.2)
            rotate(-180deg);

    }

    to {

        opacity: 1;

        transform:
            scale(1)
            rotate(0);

    }

}


.core-ring {

    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        rgba(113,224,255,.45);

}


.ring-one {

    width: 140px;
    height: 140px;

    animation:
        rotateRing 12s linear infinite;

}


.ring-two {

    width: 110px;
    height: 110px;

    border-style: dashed;

    animation:
        rotateRingReverse 9s linear infinite;

}


.ring-three {

    width: 82px;
    height: 82px;

    animation:
        pulseRing 2s ease-in-out infinite;

}


@keyframes rotateRing {

    to {
        transform: rotate(360deg);
    }

}


@keyframes rotateRingReverse {

    to {
        transform: rotate(-360deg);
    }

}


@keyframes pulseRing {

    0%,
    100% {

        transform: scale(.92);

        opacity: .6;

    }

    50% {

        transform: scale(1.08);

        opacity: 1;

    }

}


/* =========================================================
   MEDICAL CROSS
   ========================================================= */

.medical-cross {

    position: relative;

    width: 52px;

    height: 52px;

    filter:
        drop-shadow(
            0 0 15px
            rgba(79,224,255,.8)
        );

}


.medical-cross::before,
.medical-cross::after {

    content: "";

    position: absolute;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #65dcff
        );

    border-radius: 5px;

}


.medical-cross::before {

    width: 52px;

    height: 16px;

    left: 0;

    top: 18px;

}


.medical-cross::after {

    width: 16px;

    height: 52px;

    left: 18px;

    top: 0;

}


/* =========================================================
   BRAND
   ========================================================= */

.brand {

    font-size:
        clamp(38px, 7vw, 76px);

    font-weight: 800;

    letter-spacing:
        clamp(2px, 1vw, 7px);

    line-height: 1;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #79e7ff,
            #ffffff
        );

    background-size: 200% auto;

    -webkit-background-clip: text;

    background-clip: text;

    color: transparent;

    animation:
        shine 4s linear infinite;

}


@keyframes shine {

    to {

        background-position:
            200% center;

    }

}


/* =========================================================
   TAGLINE
   ========================================================= */

.tagline {

    margin-top: 18px;

    font-size:
        clamp(15px, 2vw, 22px);

    color:
        rgba(255,255,255,.75);

    letter-spacing: 2px;

}


.welcome {

    margin-top: 25px;

    font-size:
        clamp(18px, 3vw, 28px);

    font-weight: 600;

}


/* =========================================================
   HEARTBEAT
   ========================================================= */

.heartbeat {

    width:
        min(500px, 82vw);

    height: 70px;

    margin-top: 18px;

}


.heartbeat svg {

    width: 100%;

    height: 100%;

}


.heartbeat-path {

    fill: none;

    stroke: #65e4ff;

    stroke-width: 3;

    stroke-linecap: round;

    stroke-dasharray: 800;

    stroke-dashoffset: 800;

    filter:
        drop-shadow(
            0 0 8px #65e4ff
        );

    animation:
        heartbeatDraw 2.4s
        ease-in-out
        forwards;

}


@keyframes heartbeatDraw {

    to {

        stroke-dashoffset: 0;

    }

}


/* =========================================================
   PORTAL AREA
   ========================================================= */

.portal-area {

    display: none;

    width: 100%;

    margin-top: 25px;

    animation:
        portalAppear .8s ease forwards;

}


.portal-area.show {

    display: block;

}


@keyframes portalAppear {

    from {

        opacity: 0;

        transform:
            translateY(30px)
            scale(.96);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


.portal-title {

    font-size: 15px;

    text-transform: uppercase;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,.6);

    margin-bottom: 18px;

}


/* =========================================================
   PORTAL BUTTONS
   ========================================================= */

.portal-buttons {

    display: grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0, 1fr)
        );

    gap: 15px;

    width: 100%;

}


.portal {

    padding: 18px 15px;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius: 16px;

    background:
        rgba(255,255,255,.07);

    color: white;

    cursor: pointer;

    backdrop-filter:
        blur(12px);

    transition:
        .3s ease;

}


.portal:hover {

    transform:
        translateY(-7px);

    background:
        rgba(255,255,255,.14);

    border-color:
        rgba(117,225,255,.6);

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.25);

}


.portal-icon {

    display: block;

    font-size: 34px;

    margin-bottom: 8px;

}


.portal-name {

    display: block;

    font-size: 17px;

    font-weight: 700;

}


.portal-action {

    display: block;

    margin-top: 5px;

    font-size: 12px;

    color:
        rgba(255,255,255,.6);

}


/* =========================================================
   STUDENT REGISTER
   ========================================================= */

.student-register {

    margin-top: 18px;

    color:
        rgba(255,255,255,.65);

    font-size: 13px;

}


.student-register a {

    color: #72e5ff;

    text-decoration: none;

    font-weight: bold;

}


.student-register a:hover {

    text-decoration: underline;

}


/* =========================================================
   SKIP
   ========================================================= */

.skip {

    position: absolute;

    right: 25px;

    bottom: 22px;

    z-index: 20;

    padding: 9px 17px;

    border:
        1px solid
        rgba(255,255,255,.22);

    background:
        rgba(255,255,255,.06);

    color:
        rgba(255,255,255,.7);

    border-radius: 30px;

    cursor: pointer;

    backdrop-filter:
        blur(10px);

}


.skip:hover {

    background:
        rgba(255,255,255,.14);

    color: white;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    .portal-buttons {

        grid-template-columns: 1fr;

    }

    .medical-core {

        transform: scale(.8);

        margin-bottom: 5px;

    }

    .portal {

        padding: 13px;

    }

    .portal-icon {

        display: inline;

        margin-right: 8px;

        font-size: 24px;

    }

    .portal-name {

        display: inline;

    }

}


/* =========================================================
   FADE INTRO
   ========================================================= */

.intro.fade-out {

    animation:
        fadeOut .7s ease forwards;

}


@keyframes fadeOut {

    to {

        opacity: 0;

        pointer-events: none;

    }

}

</style>

</head>


<body>


<div
    class="intro"
    id="intro"
>


    <!-- Background -->

    <div class="grid"></div>


    <!-- Particles -->

    <div class="particles">

        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>

    </div>


    <!-- Medical symbols -->

    <div class="symbol one">
        ⚕
    </div>

    <div class="symbol two">
        🧬
    </div>

    <div class="symbol three">
        🫀
    </div>

    <div class="symbol four">
        🔬
    </div>


    <!-- =================================================
         CONTENT
         ================================================= -->

    <main class="content">


        <div class="medical-core">

            <div class="core-ring ring-one"></div>

            <div class="core-ring ring-two"></div>

            <div class="core-ring ring-three"></div>

            <div class="medical-cross"></div>

        </div>


        <h1 class="brand">
            MWANIKI SCHOLARS
        </h1>


        <p class="tagline">
            Learn. Understand. Master Medicine.
        </p>


        <p class="welcome">
            Welcome to your medical learning journey.
        </p>


        <!-- HEARTBEAT -->

        <div class="heartbeat">

            <svg
                viewBox="0 0 600 100"
                preserveAspectRatio="none"
            >

                <path
                    class="heartbeat-path"
                    d="
                    M0 50
                    L90 50
                    L110 50
                    L125 20
                    L140 80
                    L155 50
                    L190 50
                    L205 50
                    L220 50
                    L240 50
                    L255 10
                    L270 90
                    L285 50
                    L330 50
                    L350 50
                    L365 35
                    L380 65
                    L395 50
                    L430 50
                    L600 50
                    "
                ></path>

            </svg>

        </div>


        <!-- =================================================
             PORTALS
             ================================================= -->

        <section
            class="portal-area"
            id="portalArea"
        >

            <div class="portal-title">
                Choose your portal
            </div>


            <div class="portal-buttons">


                <!-- STUDENT -->

                <button
                    class="portal"
                    onclick="
                        window.location.href='studentLogin.html'
                    "
                >

                    <span class="portal-icon">
                        🎓
                    </span>

                    <span class="portal-name">
                        Student Portal
                    </span>

                    <span class="portal-action">
                        Login to continue
                    </span>

                </button>


                <!-- TUTOR -->

                <button
                    class="portal"
                    onclick="
                        window.location.href='tutorLogin.html'
                    "
                >

                    <span class="portal-icon">
                        👨‍🏫
                    </span>

                    <span class="portal-name">
                        Tutor Portal
                    </span>

                    <span class="portal-action">
                        Login to continue
                    </span>

                </button>


                <!-- ADMIN -->

                <button
                    class="portal"
                    onclick="
                        window.location.href='adminLogin.html'
                    "
                >

                    <span class="portal-icon">
                        ⚙️
                    </span>

                    <span class="portal-name">
                        Admin Portal
                    </span>

                    <span class="portal-action">
                        Secure login
                    </span>

                </button>


            </div>


            <!-- STUDENT REGISTRATION -->

            <div class="student-register">

                New student?

                <a
                    href="studentRegister.html"
                >
                    Create a Student Account
                </a>

            </div>


        </section>


    </main>


    <!-- SKIP -->

    <button
        class="skip"
        id="skipIntro"
        type="button"
    >
        Skip intro →
    </button>


</div>


<script>

/* =========================================================
   MWANIKI SCHOLARS — FRONT DOOR CONTROLLER
   ========================================================= */


const portalArea =
    document.getElementById(
        "portalArea"
    );


const skipIntro =
    document.getElementById(
        "skipIntro"
    );


/* =========================================================
   SHOW PORTALS
   ========================================================= */

function showPortals() {

    portalArea.classList.add(
        "show"
    );

    skipIntro.style.display =
        "none";

}


/* =========================================================
   NORMAL INTRO
   ========================================================= */

/*
    After 5 seconds the animation
    changes into the portal selector.

    THERE IS NO AUTOMATIC LOGIN.
*/

setTimeout(
    showPortals,
    5000
);


/* =========================================================
   SKIP
   ========================================================= */

skipIntro.addEventListener(
    "click",
    () => {

        showPortals();

    }
);


/* =========================================================
   KEYBOARD
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" ||
            event.key === "Enter"
        ) {

            showPortals();

        }

    }
);

</script>


</body>

</html>
