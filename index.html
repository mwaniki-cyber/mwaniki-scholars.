<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mwaniki Scholars Medical University</title>


<style>

*{
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}


body{

margin:0;
background:#eef7fb;

}



header{

background:linear-gradient(135deg,#063970,#0b7285);

color:white;

padding:20px;

text-align:center;

}


.logo{

font-size:26px;

font-weight:bold;

}





.auth-container{

height:520px;

max-width:1100px;

margin:30px auto;

position:relative;

overflow:hidden;

border-radius:25px;

}



.medical-bg{

position:absolute;

width:100%;

height:100%;

background:

linear-gradient(
135deg,
#032b3a,
#0b7285,
#38bdf8
);

}




.cross{

position:absolute;

font-size:50px;

color:rgba(255,255,255,.2);

animation:float 10s infinite;

}


.c1{
left:10%;
}

.c2{
left:35%;
animation-delay:2s;
}

.c3{
left:65%;
animation-delay:4s;
}

.c4{
left:85%;
animation-delay:6s;
}




@keyframes float{


0%{
transform:translateY(500px);
}


100%{
transform:translateY(-100px);
}


}




.auth-box{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

background:rgba(255,255,255,.15);

backdrop-filter:blur(15px);

padding:35px;

width:350px;

border-radius:20px;

text-align:center;

color:white;

}



input{

width:90%;

padding:14px;

margin:10px;

border:none;

border-radius:10px;

}



button{

width:90%;

padding:13px;

margin:7px;

border:none;

border-radius:12px;

background:#0b7285;

color:white;

font-size:15px;

cursor:pointer;

}



button:hover{

background:#064747;

}



</style>

</head>


<body>


<header>

<div class="logo">

🏥 Mwaniki Scholars Medical University

</div>

</header>





<div class="auth-container">


<div class="medical-bg">


<div class="cross c1">
✚
</div>

<div class="cross c2">
✚
</div>

<div class="cross c3">
✚
</div>

<div class="cross c4">
✚
</div>


</div>






<div class="auth-box">


<h2>
Welcome
</h2>


<p>
Medical learning platform
</p>



<input
type="email"
id="email"
placeholder="Email">



<input
type="password"
id="password"
placeholder="Password">





<button onclick="signUp()">

📝 Create Account

</button>




<button onclick="login()">

🎓 Student Login

</button>





<button onclick="tutorLogin()">

👨‍🏫 Tutor Login

</button>





<button onclick="adminLogin()">

⚙️ Admin Login

</button>





</div>


</div>





<script type="module" src="script.js"></script>


</body>

</html>
