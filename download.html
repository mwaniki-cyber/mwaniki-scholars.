
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f73">
  <meta name="description" content="Download the Mwaniki Scholars Android app.">
  <title>Download Mwaniki Scholars</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #173b3a;
      background: #f1f8f7;
    }

    .download-card {
      width: 100%;
      max-width: 480px;
      padding: 36px 26px;
      text-align: center;
      background: white;
      border: 1px solid #dcebe8;
      border-radius: 22px;
      box-shadow: 0 14px 40px rgba(15, 70, 65, 0.08);
    }

    .app-icon {
      width: 84px;
      height: 84px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 24px;
      background: #087f73;
      color: white;
      font-size: 32px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    p {
      line-height: 1.7;
      color: #5b7270;
    }

    .download-button {
      display: block;
      margin-top: 26px;
      padding: 16px 20px;
      border-radius: 12px;
      background: #087f73;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
    }

    .download-button:hover {
      background: #06665d;
    }

    .note {
      margin-top: 18px;
      font-size: 13px;
    }

    .website-link {
      display: inline-block;
      margin-top: 18px;
      color: #087f73;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="download-card">
    <div class="app-icon" aria-hidden="true">MS</div>

    <h1>Mwaniki Scholars</h1>

    <p>
      Your medical learning platform, available on your Android device.
    </p>

    <a
      class="download-button"
      href="./mwaniki-scholars.apk"
      download="mwaniki-scholars.apk"
    >
      Download Android App
    </a>

    <p class="note">
      Download the APK from the official Mwaniki Scholars website.
      Only install apps from sources you trust.
    </p>

    <a class="website-link" href="./">
      Return to Mwaniki Scholars
    </a>
  </main>
</body>
</html>
