<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#087f73"
    >

    <title>
        Mwaniki Scholars Call
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <link
        rel="stylesheet"
        href="./community.css"
    >

</head>


<body class="call-page">

    <main class="call-screen">

        <!-- =================================================
             CALL HEADER
             ================================================= -->

        <header class="call-header">

            <div>

                <strong
                    id="callRoomTitle"
                >
                    Mwaniki Scholars Call
                </strong>

                <span
                    id="callRoomSubtitle"
                >
                    Connecting securely...
                </span>

            </div>


            <div
                id="callRoomStatus"
                class="call-room-status"
            >
                Connecting
            </div>

        </header>


        <!-- =================================================
             PARTICIPANTS
             ================================================= -->

        <section
            id="callParticipantGrid"
            class="call-participant-grid"
        ></section>


        <!-- =================================================
             CONTROLS
             ================================================= -->

        <footer class="call-controls">

            <button
                id="toggleMicrophoneButton"
                class="call-control-button"
                type="button"
                title="Microphone"
            >
                🎙️
            </button>


            <button
                id="toggleCameraButton"
                class="call-control-button"
                type="button"
                title="Camera"
            >
                📹
            </button>


            <button
                id="shareScreenButton"
                class="call-control-button"
                type="button"
                title="Share screen"
            >
                🖥️
            </button>


            <button
                id="leaveCallButton"
                class="call-control-button leave-call-control"
                type="button"
                title="Leave call"
            >
                ☎
            </button>

        </footer>

    </main>


    <script
        type="module"
        src="./supabase.js"
    ></script>

    <script
        src="./community-calls.js"
    ></script>

</body>

</html>
