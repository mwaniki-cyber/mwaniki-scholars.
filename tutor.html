<style>

box-sizing:border-box;

body{

}


header{

background:linear-gradient(135deg,#063970,#0b7285);

color:white;

padding:20px;

.logo{

}



.card{

.request{

border-radius:15px;

}



textarea{

width:100%;

height:120px;

}



button{

color:white;

padding:12px 20px;

cursor:pointer;

}



button:hover{

background:#064747;

}
