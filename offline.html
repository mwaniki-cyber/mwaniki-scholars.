
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f73">
  <title>Offline | Mwaniki Scholars</title>
  <link rel="icon" href="./app-icon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f5fbfa;
      color: #173b38;
    }
    main {
      width: 100%;
      max-width: 460px;
      padding: 32px;
      text-align: center;
      background: white;
      border: 1px solid #dcebe8;
      border-radius: 22px;
      box-shadow: 0 12px 40px rgba(8, 127, 115, .08);
    }
    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
    }
    h1 { margin: 0 0 12px; }
    p { line-height: 1.65; color: #55706c; }
    button {
      width: 100%;
      padding: 14px 18px;
      border: 0;
      border-radius: 12px;
      background: #087f73;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./app-icon.svg" alt="Mwaniki Scholars">
    <h1>You’re offline</h1>
    <p>
      Mwaniki Scholars cannot connect right now.
      Reconnect to the internet to access courses, AI tutoring,
      quizzes, community messages and other live features.
    </p>
    <p>
      Notes saved for offline reading will be supported in a
      later step.
    </p>
    <button type="button" onclick="window.location.reload()">
      Try again
    </button>
  </main>
</body>
</html>
