<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Mwaniki Call
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #071311;
            color: #ffffff;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            overflow: hidden;
        }

        .call-app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .call-header {
            height: 68px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: rgba(0, 0, 0, .35);
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .call-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .call-brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: #087f73;
            font-size: 20px;
        }

        .call-title {
            font-weight: 800;
        }

        .call-status {
            font-size: 13px;
            color: #a7b8b5;
        }

        .call-main {
            flex: 1;
            min-height: 0;
            position: relative;
            padding: 14px;
            overflow: hidden;
        }

        #remoteVideos {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
            overflow: auto;
        }

        .video-tile {
            position: relative;
            min-height: 220px;
            overflow: hidden;
            border-radius: 18px;
            background: #101c1a;
            border: 1px solid rgba(255,255,255,.08);
        }

        .video-tile video {
            width: 100%;
            height: 100%;
            min-height: 220px;
            display: block;
            object-fit: cover;
            background: #000;
        }

        .video-name {
            position: absolute;
            left: 12px;
            bottom: 12px;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(0,0,0,.65);
            font-size: 13px;
            font-weight: 700;
        }

        .video-avatar {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            background: #10201d;
        }

        .video-avatar img {
            width: 88px;
            height: 88px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,.15);
        }

        #localVideoTile {
            position: absolute;
            right: 26px;
            bottom: 26px;
            width: 220px;
            height: 145px;
            z-index: 20;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            border: 2px solid rgba(255,255,255,.14);
            box-shadow: 0 14px 40px rgba(0,0,0,.4);
        }

        #localVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .call-empty {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            pointer-events: none;
        }

        .call-empty-card {
            text-align: center;
            color: #a9bab6;
        }

        .call-empty-icon {
            font-size: 56px;
            margin-bottom: 12px;
        }

        .call-controls {
            height: 86px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(0,0,0,.4);
            border-top: 1px solid rgba(255,255,255,.08);
        }

        .call-control {
            width: 50px;
            height: 50px;
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            color: #fff;
            background: #20322f;
            font-size: 20px;
            display: grid;
            place-items: center;
            transition: .15s ease;
        }

        .call-control:hover {
            transform: translateY(-2px);
            background: #29413d;
        }

        .call-control.active {
            background: #087f73;
        }

        .call-control.danger {
            background: #c43f48;
        }

        .call-error {
            position: fixed;
            top: 84px;
            left: 50%;
            transform: translateX(-50%);
            max-width: min(700px, calc(100% - 30px));
            padding: 12px 16px;
            border-radius: 12px;
            background: #542024;
            color: #fff;
            border: 1px solid rgba(255,255,255,.1);
            display: none;
            z-index: 100;
        }

        @media (max-width: 700px) {

            .call-header {
                height: 60px;
                padding: 0 12px;
            }

            .call-main {
                padding: 8px;
            }

            #localVideoTile {
                width: 130px;
                height: 92px;
                right: 14px;
                bottom: 14px;
            }

            .call-controls {
                height: 76px;
                gap: 8px;
            }

            .call-control {
                width: 46px;
                height: 46px;
            }

        }

    </style>

</head>


<body>

    <div class="call-app">

        <header class="call-header">

            <div class="call-brand">

                <div class="call-brand-icon">
                    🩺
                </div>

                <div>

                    <div
                        id="callTitle"
                        class="call-title"
                    >
                        Mwaniki Call
                    </div>

                    <div
                        id="callStatus"
                        class="call-status"
                    >
                        Connecting...
                    </div>

                </div>

            </div>

            <div id="participantCount">
                0 participants
            </div>

        </header>


        <div
            id="callError"
            class="call-error"
        ></div>


        <main class="call-main">

            <div
                id="remoteVideos"
            ></div>


            <div
                id="callEmpty"
                class="call-empty"
            >

                <div class="call-empty-card">

                    <div class="call-empty-icon">
                        📞
                    </div>

                    <div>
                        Waiting for participants...
                    </div>

                </div>

            </div>


            <div id="localVideoTile">

                <video
                    id="localVideo"
                    autoplay
                    muted
                    playsinline
                ></video>

            </div>

        </main>


        <footer class="call-controls">

            <button
                id="muteButton"
                class="call-control"
                title="Mute microphone"
            >
                🎙️
            </button>

            <button
                id="cameraButton"
                class="call-control"
                title="Turn camera off"
            >
                📷
            </button>

            <button
                id="screenButton"
                class="call-control"
                title="Share screen"
            >
                🖥️
            </button>

            <button
                id="hangupButton"
                class="call-control danger"
                title="End call"
            >
                ☎
            </button>

        </footer>

    </div>


    <script type="module" src="./supabase.js"></script>

    <script type="module" src="./community-call.js"></script>

</body>

</html>
