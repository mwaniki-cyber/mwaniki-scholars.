<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mwaniki Scholars Call</title>

    <style>

        :root {
            --bg: #080d12;
            --panel: #10171e;
            --panel2: #151e27;
            --border: rgba(255,255,255,.08);
            --text: #edf4f4;
            --muted: #819099;
            --primary: #087f73;
            --green: #36c875;
            --red: #e75b63;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;

            background: var(--bg);
            color: var(--text);

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        .call-app {
            width: 100%;
            height: 100%;

            display: grid;
            grid-template-rows: 64px minmax(0, 1fr) 78px;

            overflow: hidden;
        }

        .call-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 17px;

            background: #0b1117;
            border-bottom: 1px solid var(--border);
        }

        .call-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .call-title-icon {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;

            border-radius: 10px;

            background: rgba(8,127,115,.17);
        }

        .call-title-copy strong {
            display: block;

            font-size: 13px;
        }

        .call-title-copy span {
            display: block;

            margin-top: 3px;

            color: var(--muted);

            font-size: 9px;
        }

        .call-status {
            color: var(--muted);
            font-size: 10px;
        }

        .call-stage {
            min-height: 0;

            display: grid;

            padding: 12px;

            overflow: auto;
        }

        .video-grid {
            width: 100%;
            min-height: 100%;

            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        220px,
                        1fr
                    )
                );

            gap: 10px;
        }

        .video-tile {
            min-height: 210px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            overflow: hidden;

            border: 1px solid var(--border);
            border-radius: 13px;

            background:
                radial-gradient(
                    circle at center,
                    #1a2830,
                    #0c1319
                );
        }

        .video-tile video {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .video-tile.local video {
            transform: scaleX(-1);
        }

        .video-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;

            color: var(--muted);

            text-align: center;
        }

        .video-placeholder-avatar {
            width: 58px;
            height: 58px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background: #26333c;

            color: #dce8e8;

            font-weight: 800;
            font-size: 20px;
        }

        .video-label {
            position: absolute;
            left: 9px;
            bottom: 9px;

            padding: 5px 8px;

            border-radius: 6px;

            background: rgba(0,0,0,.62);

            font-size: 9px;
        }

        .video-mute {
            position: absolute;
            right: 9px;
            bottom: 9px;

            width: 25px;
            height: 25px;

            display: grid;
            place-items: center;

            border-radius: 50%;

            background: rgba(0,0,0,.62);

            font-size: 11px;
        }

        .call-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            background: #0b1117;
            border-top: 1px solid var(--border);
        }

        .call-control {
            width: 44px;
            height: 44px;

            display: grid;
            place-items: center;

            border: 1px solid var(--border);
            border-radius: 50%;

            background: #151e27;
            color: var(--text);

            font-size: 16px;
        }

        .call-control:hover {
            background: #202c36;
        }

        .call-control.active {
            background: rgba(8,127,115,.24);
            border-color: rgba(8,127,115,.5);
        }

        .call-control.end {
            background: var(--red);
            border-color: var(--red);
        }

        .call-control.end:hover {
            background: #f06b72;
        }

        .call-error {
            position: fixed;
            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            max-width: 420px;

            padding: 15px;

            border: 1px solid rgba(231,91,99,.35);
            border-radius: 10px;

            background: #201417;

            color: #ffb9bc;

            font-size: 11px;

            text-align: center;

            z-index: 100;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 650px) {

            .call-app {
                grid-template-rows:
                    58px
                    minmax(0,1fr)
                    72px;
            }

            .video-grid {
                grid-template-columns:
                    repeat(
                        auto-fit,
                        minmax(
                            150px,
                            1fr
                        )
                    );
            }

            .video-tile {
                min-height: 150px;
            }

        }

    </style>

</head>

<body>

<div class="call-app">

    <header class="call-header">

        <div class="call-title">

            <div class="call-title-icon">
                📞
            </div>

            <div class="call-title-copy">

                <strong id="callTitle">
                    Mwaniki Scholars Call
                </strong>

                <span id="callSubtitle">
                    Connecting...
                </span>

            </div>

        </div>

        <div
            id="callStatus"
            class="call-status"
        >
            Preparing call...
        </div>

    </header>


    <main class="call-stage">

        <div
            id="videoGrid"
            class="video-grid"
        >

            <div
                id="localTile"
                class="video-tile local"
            >

                <video
                    id="localVideo"
                    autoplay
                    playsinline
                    muted
                ></video>

                <div
                    id="localPlaceholder"
                    class="video-placeholder"
                >

                    <div
                        id="localAvatar"
                        class="video-placeholder-avatar"
                    >
                        MS
                    </div>

                    <span>
                        You
                    </span>

                </div>

                <span
                    id="localLabel"
                    class="video-label"
                >
                    You
                </span>

                <span
                    id="localMuteIndicator"
                    class="video-mute hidden"
                >
                    🔇
                </span>

            </div>

        </div>

    </main>


    <footer class="call-controls">

        <button
            id="muteButton"
            class="call-control"
            type="button"
            title="Mute"
        >
            🎙
        </button>

        <button
            id="cameraButton"
            class="call-control"
            type="button"
            title="Camera"
        >
            📹
        </button>

        <button
            id="screenButton"
            class="call-control"
            type="button"
            title="Share screen"
        >
            🖥
        </button>

        <button
            id="endCallButton"
            class="call-control end"
            type="button"
            title="End call"
        >
            ☎
        </button>

    </footer>

</div>


<div
    id="callError"
    class="call-error hidden"
></div>


<script
    type="module"
    src="./supabase.js"
></script>

<script
    type="module"
    src="./community-call.js"
></script>

</body>
</html>
