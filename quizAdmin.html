<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Quiz | Mwaniki Scholars
    </title>

    <meta
        name="description"
        content="Mwaniki Scholars online medical quiz"
    >

    <link
        rel="icon"
        href="./favicon.ico"
    >

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f4f7fb;

            color:
                #172033;

        }


        button {

            font-family:
                inherit;

            cursor:
                pointer;

        }


        .page-header {

            background:
                #ffffff;

            border-bottom:
                1px solid #e5e7eb;

            padding:
                18px 25px;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                15px;

        }


        .brand {

            font-size:
                22px;

            font-weight:
                700;

        }


        .back-button {

            border:
                none;

            background:
                #eef2ff;

            color:
                #3730a3;

            padding:
                10px 16px;

            border-radius:
                8px;

        }


        #quizArea {

            width:
                min(100% - 30px, 900px);

            margin:
                35px auto;

        }


        .quiz-container {

            width:
                100%;

        }


        .quiz-header {

            background:
                #ffffff;

            border-radius:
                15px;

            padding:
                25px;

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                20px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.06);

        }


        .quiz-header h1 {

            margin:
                0 0 8px;

            font-size:
                26px;

        }


        .quiz-header p {

            margin:
                0;

            color:
                #667085;

        }


        .quiz-counter {

            white-space:
                nowrap;

            font-weight:
                700;

        }


        .quiz-progress {

            height:
                8px;

            background:
                #e5e7eb;

            border-radius:
                20px;

            overflow:
                hidden;

            margin:
                15px 0;

        }


        .quiz-progress-bar {

            height:
                100%;

            background:
                #2563eb;

            transition:
                width .3s ease;

        }


        .question-card {

            background:
                #ffffff;

            border-radius:
                15px;

            padding:
                30px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.06);

        }


        .question-number {

            display:
                inline-block;

            background:
                #eff6ff;

            color:
                #1d4ed8;

            padding:
                7px 12px;

            border-radius:
                20px;

            font-weight:
                700;

            margin-bottom:
                18px;

        }


        .question-text {

            font-size:
                22px;

            line-height:
                1.5;

            margin:
                0 0 25px;

        }


        .quiz-options {

            display:
                grid;

            gap:
                13px;

        }


        .quiz-option {

            width:
                100%;

            text-align:
                left;

            display:
                flex;

            align-items:
                center;

            gap:
                15px;

            padding:
                17px;

            background:
                #ffffff;

            border:
                2px solid #e5e7eb;

            border-radius:
                10px;

            transition:
                .2s ease;

        }


        .quiz-option:hover {

            border-color:
                #93c5fd;

            background:
                #f8fbff;

        }


        .quiz-option.selected {

            border-color:
                #2563eb;

            background:
                #eff6ff;

        }


        .option-letter {

            min-width:
                38px;

            height:
                38px;

            border-radius:
                50%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            background:
                #f1f5f9;

            font-weight:
                700;

        }


        .selected
        .option-letter {

            background:
                #2563eb;

            color:
                #ffffff;

        }


        .option-text {

            font-size:
                16px;

            line-height:
                1.4;

        }


        .quiz-navigation {

            display:
                flex;

            justify-content:
                space-between;

            gap:
                15px;

            margin-top:
                25px;

        }


        .quiz-navigation button,
        .result-buttons button,
        .quiz-error button,
        .quiz-empty button {

            border:
                none;

            padding:
                12px 20px;

            border-radius:
                9px;

            font-weight:
                700;

        }


        .quiz-back-button {

            background:
                #e5e7eb;

            color:
                #374151;

        }


        .quiz-back-button:disabled {

            opacity:
                .45;

            cursor:
                not-allowed;

        }


        .quiz-next-button {

            background:
                #2563eb;

            color:
                #ffffff;

        }


        .quiz-loading,
        .quiz-error,
        .quiz-empty,
        .quiz-results {

            background:
                #ffffff;

            border-radius:
                15px;

            padding:
                45px 30px;

            text-align:
                center;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.06);

        }


        .loading-spinner {

            font-size:
                50px;

            margin-bottom:
                15px;

        }


        .quiz-results h1 {

            margin:
                10px 0;

        }


        .result-icon {

            font-size:
                70px;

        }


        .score-box {

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                25px;

            margin:
                25px auto;

        }


        .score-number {

            font-size:
                45px;

            font-weight:
                800;

        }


        .score-percentage {

            font-size:
                30px;

            font-weight:
                700;

            color:
                #2563eb;

        }


        .result-buttons {

            display:
                flex;

            justify-content:
                center;

            gap:
                12px;

            flex-wrap:
                wrap;

            margin-top:
                25px;

        }


        .result-buttons button:first-child {

            background:
                #2563eb;

            color:
                white;

        }


        .result-buttons button:last-child {

            background:
                #e5e7eb;

        }


        @media (
            max-width: 650px
        ) {

            .page-header {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .quiz-header {

                flex-direction:
                    column;

                align-items:
                    flex-start;

            }


            .question-card {

                padding:
                    20px;

            }


            .question-text {

                font-size:
                    19px;

            }


            .quiz-navigation {

                flex-direction:
                    column;

            }

        }

    </style>

</head>


<body>


    <header class="page-header">

        <div class="brand">
            📚 Mwaniki Scholars
        </div>


        <button
            class="back-button"
            onclick="goBackToCourse()"
        >
            ← Back to Course
        </button>

    </header>


    <main>

        <div id="quizArea">

            <div class="quiz-loading">

                <div class="loading-spinner">
                    ⏳
                </div>

                <h2>
                    Loading Quiz...
                </h2>

                <p>
                    Please wait.
                </p>

            </div>

        </div>

    </main>


    <!-- ONLY QUIZ SCRIPT -->
    <script
        type="module"
        src="./quiz.js"
    ></script>


</body>

</html>
