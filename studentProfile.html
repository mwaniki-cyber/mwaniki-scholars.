<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mwaniki Scholars | My Profile</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top right,
            #0b7285,
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #031b2e,
            #063970 55%,
            #0b7285
        );

    padding: 30px;

    color: #17324d;

}


.profile-wrapper {

    max-width: 950px;

    margin: auto;

    background: white;

    border-radius: 28px;

    overflow: hidden;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.3);

}


/* =========================================================
   HEADER
   ========================================================= */

.profile-header {

    padding: 25px 35px;

    background:
        linear-gradient(
            135deg,
            #063970,
            #0b7285
        );

    color: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

}


.profile-header h1 {

    margin: 0;

    font-size: 24px;

}


.profile-header button {

    border: 1px solid
        rgba(255,255,255,.4);

    background:
        rgba(255,255,255,.12);

    color: white;

    padding: 10px 16px;

    border-radius: 10px;

    cursor: pointer;

}


/* =========================================================
   CONTENT
   ========================================================= */

.profile-content {

    padding: 45px;

}


/* =========================================================
   PHOTO
   ========================================================= */

.photo-section {

    text-align: center;

    margin-bottom: 35px;

}


.profile-photo {

    width: 150px;

    height: 150px;

    border-radius: 50%;

    object-fit: cover;

    border:
        5px solid #e6f4f7;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.15);

    background:
        #edf5f7;

}


.photo-placeholder {

    width: 150px;

    height: 150px;

    border-radius: 50%;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 60px;

    background:
        linear-gradient(
            135deg,
            #e6f4f7,
            #d8edf2
        );

    border:
        5px solid #e6f4f7;

}


.photo-button {

    display: inline-block;

    margin-top: 15px;

    padding: 10px 18px;

    border-radius: 10px;

    background: #063970;

    color: white;

    cursor: pointer;

    font-size: 14px;

}


#photoInput {

    display: none;

}


/* =========================================================
   FORM
   ========================================================= */

.form-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 20px;

}


.field {

    display: flex;

    flex-direction: column;

}


.field.full {

    grid-column: 1 / -1;

}


.field label {

    font-size: 13px;

    font-weight: bold;

    color: #40566b;

    margin-bottom: 7px;

}


.field input {

    padding: 14px;

    border:
        1px solid #d8e1e8;

    border-radius: 12px;

    outline: none;

    font-size: 15px;

}


.field input:focus {

    border-color: #0b7285;

    box-shadow:
        0 0 0 3px
        rgba(11,114,133,.1);

}


.field input[readonly] {

    background:
        #f4f7f9;

    color:
        #718096;

}


/* =========================================================
   SAVE
   ========================================================= */

.save-button {

    width: 100%;

    margin-top: 30px;

    padding: 16px;

    border: 0;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #063970,
            #0b7285
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


.save-button:disabled {

    opacity: .6;

    cursor: wait;

}


#profileStatus {

    text-align: center;

    min-height: 25px;

    margin-top: 15px;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

    body {

        padding: 12px;

    }


    .profile-header {

        padding: 20px;

    }


    .profile-content {

        padding: 25px 20px;

    }


    .form-grid {

        grid-template-columns: 1fr;

    }


    .field.full {

        grid-column: auto;

    }

}

</style>

</head>


<body>


<div class="profile-wrapper">


    <!-- HEADER -->

    <header class="profile-header">

        <h1>
            🎓 My Student Profile
        </h1>


        <button
            id="dashboardButton"
            type="button"
        >
            ← Dashboard
        </button>

    </header>


    <!-- CONTENT -->

    <main class="profile-content">


        <!-- PHOTO -->

        <section class="photo-section">


            <div id="photoContainer">

                <div class="photo-placeholder">
                    👤
                </div>

            </div>


            <label
                for="photoInput"
                class="photo-button"
            >
                📷 Change Profile Photo
            </label>


            <input
                id="photoInput"
                type="file"
                accept="image/*"
            >


        </section>


        <!-- FORM -->

        <form id="profileForm">


            <div class="form-grid">


                <div class="field full">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        id="fullName"
                        type="text"
                        placeholder="Your full name"
                        required
                    >

                </div>


                <div class="field full">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        id="email"
                        type="email"
                        readonly
                    >

                </div>


                <div class="field">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        id="phone"
                        type="text"
                        placeholder="Phone number"
                    >

                </div>


                <div class="field">

                    <label for="course">
                        Course
                    </label>

                    <input
                        id="course"
                        type="text"
                        placeholder="Your course"
                    >

                </div>


                <div class="field full">

                    <label for="level">
                        Level / Year
                    </label>

                    <input
                        id="level"
                        type="text"
                        placeholder="e.g. Year 2"
                    >

                </div>


            </div>


            <button
                type="submit"
                class="save-button"
                id="saveButton"
            >

                💾 Save Profile

            </button>


        </form>


        <div id="profileStatus"></div>


    </main>


</div>


<script
    type="module"
    src="studentProfile.js"
></script>


</body>

</html>
```
