<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mwaniki Scholars | Student Registration</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="login-container">


<h1>🎓 Student Registration</h1>

<h3>Mwaniki Scholars</h3>


<input 
id="studentName"
type="text"
placeholder="Full Name">


<input 
id="studentEmail"
type="email"
placeholder="Email Address">


<input 
id="studentPhone"
type="text"
placeholder="Phone Number">


<input 
id="studentCourse"
type="text"
placeholder="Course">


<input 
id="studentLevel"
type="text"
placeholder="Level / Year">


<input 
id="studentPassword"
type="password"
placeholder="Password">


<button onclick="registerStudent()">

Create Student Account

</button>


<p id="registerStatus"></p>


<hr>


<p>
Already have an account?
</p>


<a href="studentLogin.html">

Login here

</a>


<br><br>


<a href="index.html">

🏠 Back Home

</a>



</div>



<script type="module" src="studentRegister.js"></script>


</body>

</html>
