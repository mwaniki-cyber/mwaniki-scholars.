<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Course | Mwaniki Scholars
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>

<body>

<header class="course-header">

    <button
        type="button"
        onclick="history.back()"
    >
        ← Back
    </button>

    <div class="course-header-content">

        <h1 id="courseTitle">
            Loading Course...
        </h1>

        <p id="courseDescription">
            Loading course description...
        </p>

    </div>

</header>


<main>

    <section
        id="courseArea"
        class="course-area"
    >

        <!-- IMPORTANT:
             course.js loads the Supabase units here
        -->

        <div
            id="unitsArea"
            class="units-area"
        >

            <div class="loading">
                📚 Loading units...
            </div>

        </div>


        <!-- Notes are displayed here -->

        <div
            id="notesArea"
            class="notes-area"
        ></div>

    </section>

</main>


<script
    type="module"
    src="./course.js"
></script>

</body>

</html>
