<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Course | Mwaniki Scholars
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <!-- =====================================================
         COURSE HEADER
         ===================================================== -->

    <header class="course-header">

        <!-- BACK TO DASHBOARD -->

        <button
            type="button"
            id="backToDashboard"
            class="dashboard-back-button"
        >
            ← Back to Dashboard
        </button>


        <div class="course-header-content">

            <h1 id="courseTitle">
                Loading Course...
            </h1>

            <p id="courseDescription">
                Please wait while the course loads.
            </p>

        </div>

    </header>


    <!-- =====================================================
         MAIN COURSE AREA
         ===================================================== -->

    <main class="course-area">


        <!-- =================================================
             UNITS
             ================================================= -->

        <section>

            <h2>
                📚 Course Units
            </h2>


            <div
                id="unitsArea"
                class="units-area"
            >

                <div class="loading">
                    ⏳ Loading units...
                </div>

            </div>

        </section>


        <!-- =================================================
             NOTES
             ================================================= -->

        <section
            id="notesArea"
            class="notes-area"
        >

            <div class="loading">

                📖 Select
                <strong>View Notes</strong>
                to study a unit.

            </div>

        </section>


    </main>


    <!-- =====================================================
         BACK TO DASHBOARD SCRIPT
         ===================================================== -->

    <script>

        document
            .getElementById("backToDashboard")
            .addEventListener("click", function () {

                console.log(
                    "🏠 Returning to student dashboard..."
                );


                /*
                 * Clear only the current course/unit selection.
                 * This prevents the previous course from being
                 * accidentally reopened.
                 */

                localStorage.removeItem(
                    "selectedCourse"
                );

                localStorage.removeItem(
                    "selectedCourseName"
                );

                localStorage.removeItem(
                    "selectedUnit"
                );

                localStorage.removeItem(
                    "selectedUnitTitle"
                );


                /*
                 * IMPORTANT:
                 * Use the actual dashboard file here.
                 *
                 * If your dashboard is called dashboard.html,
                 * this is correct.
                 */

                window.location.href =
                    "./dashboard.html";

            });

    </script>


    <!-- =====================================================
         COURSE ENGINE
         ===================================================== -->

    <script
        type="module"
        src="./course.js"
    ></script>


</body>

</html>
