<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Mwaniki Scholars course learning page."
    >

    <meta
        name="theme-color"
        content="#087f73"
    >

    <title>
        Course | Mwaniki Scholars
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <style>

        /* =====================================================
           COURSE COMMUNITY BUTTON
           ===================================================== */

        .course-action-bar {
            width: 100%;
            max-width: 1440px;
            margin: 0 auto;
            padding: 18px 24px 0;
            box-sizing: border-box;

            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }


        .course-community-button {
            border: none;
            border-radius: 10px;

            padding: 12px 20px;

            background: #087f73;
            color: #ffffff;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;

            box-shadow:
                0 4px 12px rgba(8, 127, 115, 0.20);
        }


        .course-community-button:hover {
            background: #066b61;

            transform: translateY(-1px);

            box-shadow:
                0 6px 16px rgba(8, 127, 115, 0.28);
        }


        .course-community-button:active {
            transform: translateY(0);
        }


        .course-community-button:focus-visible {
            outline: 3px solid rgba(8, 127, 115, 0.25);
            outline-offset: 2px;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            .course-action-bar {
                padding-left: 16px;
                padding-right: 16px;

                justify-content: stretch;
            }


            .course-community-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         COURSE HEADER
         ===================================================== -->

    <header class="course-header">

        <!-- BACK TO DASHBOARD -->

        <button
            type="button"
            id="backToDashboard"
            class="dashboard-back-button"
        >
            ← Back to Dashboard
        </button>


        <div class="course-header-content">

            <h1 id="courseTitle">
                Loading Course...
            </h1>


            <p id="courseDescription">
                Please wait while the course loads.
            </p>

        </div>

    </header>



    <!-- =====================================================
         COURSE ACTIONS
         ===================================================== -->

    <div class="course-action-bar">

        <button
            type="button"
            id="openCourseCommunity"
            class="course-community-button"
        >
            💬 Open Course Community
        </button>

    </div>



    <!-- =====================================================
         MAIN COURSE AREA
         ===================================================== -->

    <main class="course-area">


        <!-- =================================================
             UNITS
             ================================================= -->

        <section>

            <h2>
                📚 Course Units
            </h2>


            <div
                id="unitsArea"
                class="units-area"
            >

                <div class="loading">
                    ⏳ Loading units...
                </div>

            </div>

        </section>



        <!-- =================================================
             NOTES
             ================================================= -->

        <section
            id="notesArea"
            class="notes-area"
        >

            <div class="loading">

                📖 Select
                <strong>View Notes</strong>
                to study a unit.

            </div>

        </section>


    </main>



    <!-- =====================================================
         COURSE NAVIGATION
         ===================================================== -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            /* =================================================
               BACK TO DASHBOARD
               ================================================= */

            const backButton =
                document.getElementById("backToDashboard");


            if (backButton) {

                backButton.addEventListener(
                    "click",
                    function () {

                        console.log(
                            "🏠 Returning to student dashboard..."
                        );


                        /*
                         * Clear temporary course/unit selections.
                         */

                        localStorage.removeItem(
                            "selectedCourse"
                        );

                        localStorage.removeItem(
                            "selectedCourseName"
                        );

                        localStorage.removeItem(
                            "selectedUnit"
                        );

                        localStorage.removeItem(
                            "selectedUnitTitle"
                        );


                        /*
                         * Return to dashboard.
                         */

                        window.location.href =
                            "./dashboard.html";

                    }
                );

            }



            /* =================================================
               OPEN COURSE COMMUNITY
               ================================================= */

            const communityButton =
                document.getElementById(
                    "openCourseCommunity"
                );


            if (communityButton) {

                communityButton.addEventListener(
                    "click",
                    function () {

                        /*
                         * The course ID is normally stored by
                         * dashboard.js when the student opens a
                         * course.
                         */

                        const courseId =
                            localStorage.getItem(
                                "selectedCourse"
                            );


                        const courseName =
                            localStorage.getItem(
                                "selectedCourseName"
                            );


                        console.log(
                            "💬 Opening course community:",
                            {
                                courseId,
                                courseName
                            }
                        );


                        /*
                         * A course must be selected before
                         * opening its community.
                         */

                        if (!courseId) {

                            console.warn(
                                "⚠️ No selected course ID found."
                            );


                            alert(
                                "Please return to the Course Library and open the course again."
                            );


                            return;

                        }


                        /*
                         * Preserve the course information so
                         * community.js can identify the correct
                         * course-specific community.
                         */

                        localStorage.setItem(
                            "communityCourseId",
                            String(courseId)
                        );


                        if (courseName) {

                            localStorage.setItem(
                                "communityCourseName",
                                courseName
                            );

                        }


                        /*
                         * Open the course-specific community.
                         */

                        window.location.href =
                            "./community.html";

                    }
                );

            }

        });

    </script>



    <!-- =====================================================
         COURSE ENGINE
         ===================================================== -->

    <script
        type="module"
        src="./course.js"
    ></script>


</body>

</html>
