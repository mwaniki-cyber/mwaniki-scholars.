<!DOCTYPE html>
<html>

<head>

<title>Mwaniki Scholars Admin Login</title>

<style>

body{

margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial;
background:linear-gradient(135deg,#063970,#0b7285);

}


.box{

background:white;
padding:35px;
width:350px;
border-radius:20px;
text-align:center;

}


input{

width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;

}



button{

width:100%;
padding:12px;
background:#063970;
color:white;
border:0;
border-radius:10px;
cursor:pointer;

}



</style>


</head>


<body>



<div class="box">


<h2>

⚙️ Admin Login

</h2>



<input id="adminEmail" placeholder="Admin Email">


<input id="adminPassword" type="password" placeholder="Password">



<button onclick="adminLogin()">

🔐 Login

</button>



<p id="status"></p>


</div>



<script type="module" src="adminAuth.js"></script>


</body>

</html>
