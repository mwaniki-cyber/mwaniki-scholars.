```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Mwaniki Scholars | Student Login</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at top right,
            #0b7285,
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #031b2e,
            #063970,
            #0b7285
        );

}


.login-card {

    width: 100%;

    max-width: 430px;

    background: white;

    padding: 42px;

    border-radius: 25px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.35);

    text-align: center;

}


.logo {

    width: 75px;

    height: 75px;

    margin: 0 auto 20px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 38px;

    background:
        linear-gradient(
            135deg,
            #063970,
            #0b7285
        );

    box-shadow:
        0 10px 25px
        rgba(6,57,112,.25);

}


h1 {

    margin: 0;

    color: #063970;

    font-size: 29px;

}


.subtitle {

    margin: 8px 0 30px;

    color: #718096;

}


.field {

    text-align: left;

    margin-bottom: 17px;

}


.field label {

    display: block;

    margin-bottom: 7px;

    font-size: 13px;

    font-weight: bold;

    color: #40566b;

}


.field input {

    width: 100%;

    padding: 14px;

    border:
        1px solid #d8e1e8;

    border-radius: 12px;

    outline: none;

    font-size: 15px;

}


.field input:focus {

    border-color: #0b7285;

    box-shadow:
        0 0 0 3px
        rgba(11,114,133,.1);

}


.login-button {

    width: 100%;

    padding: 15px;

    border: 0;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #063970,
            #0b7285
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 5px;

}


.login-button:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 25px
        rgba(6,57,112,.25);

}


.login-button:disabled {

    opacity: .6;

    cursor: wait;

}


#loginStatus {

    min-height: 25px;

    margin: 18px 0;

    font-size: 14px;

}


.links {

    margin-top: 20px;

    line-height: 1.8;

    font-size: 14px;

    color: #718096;

}


.links a {

    color: #063970;

    font-weight: bold;

    text-decoration: none;

}


.links a:hover {

    text-decoration: underline;

}


</style>

</head>


<body>


<div class="login-card">


    <div class="logo">
        🎓
    </div>


    <h1>
        Student Portal
    </h1>


    <p class="subtitle">
        Welcome back to Mwaniki Scholars
    </p>


    <form id="studentLoginForm">


        <div class="field">

            <label for="studentEmail">
                Email Address
            </label>

            <input
                id="studentEmail"
                type="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="field">

            <label for="studentPassword">
                Password
            </label>

            <input
                id="studentPassword"
                type="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-button"
            id="loginButton"
        >

            🔐 Login to Student Portal

        </button>


    </form>


    <p id="loginStatus"></p>


    <div class="links">


        <div>

            New student?

            <a href="studentRegister.html">
                Create an account
            </a>

        </div>


        <div>

            <a href="index.html">
                🏠 Back to Mwaniki Scholars
            </a>

        </div>


    </div>


</div>


<script type="module">

import { supabase }
    from "./supabase.js";


const form =
    document.getElementById(
        "studentLoginForm"
    );


const button =
    document.getElementById(
        "loginButton"
    );


const status =
    document.getElementById(
        "loginStatus"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById(
                    "studentEmail"
                )
                .value
                .trim();


        const password =
            document
                .getElementById(
                    "studentPassword"
                )
                .value;


        if (!email || !password) {

            status.textContent =
                "❌ Please enter your email and password.";

            return;

        }


        button.disabled = true;

        button.textContent =
            "⏳ Signing in...";

        status.textContent = "";


        try {


            const {
                data,
                error
            } = await supabase.auth.signInWithPassword({

                email: email,

                password: password

            });


            if (error) {

                console.error(
                    "Student login error:",
                    error
                );

                status.textContent =
                    "❌ " + error.message;

                return;

            }


            if (!data.user) {

                status.textContent =
                    "❌ Login could not be completed.";

                return;

            }


            console.log(
                "✅ Student authenticated:",
                data.user.id
            );


            status.textContent =
                "✅ Login successful. Opening Student Portal...";


            /*
             * IMPORTANT:
             * Change this ONLY if your actual
             * student dashboard has a different
             * filename.
             */

            setTimeout(
                () => {

                    window.location.href =
                        "dashboard.html";

                },
                800
            );


        }

        catch (error) {

            console.error(
                "Unexpected student login error:",
                error
            );

            status.textContent =
                "❌ " +
                (error.message ||
                "Unable to log in.");

        }

        finally {

            button.disabled = false;

            button.textContent =
                "🔐 Login to Student Portal";

        }

    }

);

</script>


</body>

</html>
