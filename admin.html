<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mwaniki Scholars Admin</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f8fc;
margin:0;
}


header{

background:#0f3d56;
color:white;
padding:20px;
text-align:center;

}


.container{

padding:30px;

}


.cards{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;

}


.card{

background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);

}


button{

background:#0b7285;
color:white;
border:none;
padding:12px;
border-radius:8px;
cursor:pointer;

}

</style>

</head>


<body>


<header>

<h1>
⚙️ Mwaniki Scholars Admin Center
</h1>

<p>
Control your learning platform
</p>

</header>



<div class="container">


<div class="cards">


<div class="card">

<h2>📚 Courses</h2>

<p>
Manage medical courses
</p>

<button>
Manage Courses
</button>

</div>



<div class="card">

<h2>📄 Notes</h2>

<p>
Upload and organize notes
</p>

<button>
Upload Notes
</button>

</div>




<div class="card">

<h2>🎥 Videos</h2>

<p>
Manage lectures
</p>

<button>
Upload Video
</button>

</div>



</div>


</div>


<script type="module" src="firebase.js"></script>


</body>

</html>
